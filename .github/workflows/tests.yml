name: Tests

on:
  push:
    branches: [main, prometheus-v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check the sandbox inside a Windows virtual environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.ci-venv\Scripts\python.exe -m pytest -q tests/test_v3_audit_sandbox.py tests/test_v3_m3_audit_a.py -k "ctypes or windows_venv"
      - name: Run tests
        run: python -m pytest -q -rs

  extras:
    # every add-on really installs on Windows with Python 3.14 (voice, photos, browser, desktop window)
    name: Windows add-ons, Python 3.14
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install everything, as the installer does
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,browser,photos,voice]"
          if ($LASTEXITCODE -ne 0) { throw "an add-on didn't install" }
          python -m pip install --no-deps --ignore-requires-python "kokoro-onnx>=0.4"
          if ($LASTEXITCODE -ne 0) { throw "the laptop voice didn't install" }
      - name: Every add-on loads
        run: python -c "import webview, pystray, playwright, fastembed, rapidocr, vosk, faster_whisper, kokoro_onnx, sounddevice, numpy, onnxruntime; print('all add-ons load')"

  clickthrough:
    # M2: a real browser clicks every control of the new interface; a dead button or page error fails the run
    name: Click through the interface (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev,browser]"
          python -m playwright install chromium
      - name: Click everything
        run: python -m pytest -q -rs tests/test_v3_clickthrough.py
