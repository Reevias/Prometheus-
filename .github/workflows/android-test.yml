name: Android app test

# Builds Prometheus.apk, starts a real Android emulator, installs the app and tries it, with screenshots.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-test.yml"]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon && cp android/app/build/outputs/apk/release/app-release.apk Prometheus.apk
      - name: Let the emulator use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Try the app on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/test-on-emulator.sh Prometheus.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: shots/
