<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · My Website</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="./">My Website</a>
      <a class="back-link" href="./">&larr; Back to home</a>
    </div>
  </header>

  <main id="main" class="auth-main">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in with your email to continue.</p>

      <form class="auth-form" data-auth-form="login" novalidate>
        <div class="form-alert" role="alert" hidden></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" autofocus>
          <p class="field-error" id="email-error"></p>
        </div>
        <div class="field">
          <div class="field-row">
            <label for="password">Password</label>
            <a class="field-link" href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-hint password-error">
            <button type="button" class="toggle-password" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <p class="field-error" id="password-error"></p>
        </div>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>
</body>
</html>
