<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · My Website</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="./">My Website</a>
      <a class="back-link" href="./">&larr; Back to home</a>
    </div>
  </header>

  <main id="main" class="auth-main">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="auth-sub">Enter the email you signed up with and we'll send you a link to choose a new one.</p>

      <form class="auth-form" data-auth-form="forgot" novalidate>
        <div class="form-alert" role="alert" hidden></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" autofocus>
          <p class="field-error" id="email-error"></p>
        </div>
        <button class="btn btn-block" type="submit">Send reset link</button>
      </form>

      <div class="auth-done" data-done hidden>
        <div class="status-icon" aria-hidden="true">&#9993;</div>
        <p>If an account exists for <strong data-sent-to></strong>, a reset link is on its way. It expires in 1 hour.</p>
        <p class="field-hint">Don't see it? Check your spam folder.</p>
      </div>

      <p class="auth-switch">Remembered it? <a href="login.html">Back to log in</a></p>
    </div>
  </main>
</body>
</html>
