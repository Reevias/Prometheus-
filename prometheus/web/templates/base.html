<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prometheus</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0e0f11">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <script>try{var t=localStorage.getItem("prom-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/orb.js" defer></script>
  <script src="/static/phone.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
<header>
  <button type="button" class="menu-btn" aria-label="Open the menu" aria-controls="drawer" aria-expanded="false"
          onclick="promDrawer(true)">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <span class="brand"><span id="core" hx-get="/status?core=1" hx-trigger="load, every 2s [document.visibilityState === 'visible']" hx-swap="innerHTML"><span class="core"></span></span>Prometheus</span>
  <span class="spacer"></span>
  <span id="mic" hx-get="/voice/pill" hx-trigger="load, every 2s [document.visibilityState === 'visible']"></span>
  <span id="status-mini" hx-get="/status?mini=1" hx-trigger="load, every 4s [document.visibilityState === 'visible']"></span>
  {% if stopped %}
    <button class="ok" hx-post="/kill/reset" hx-swap="none" hx-on::after-request="location.reload()">Resume</button>
  {% else %}
    <button class="danger" hx-post="/kill" hx-swap="none" hx-on::after-request="location.reload()">Stop all</button>
  {% endif %}
  <button type="button" class="theme-toggle" title="Switch between dark and light" aria-label="Switch between dark and light"
          onclick="const h=document.documentElement, t=h.dataset.theme==='light'?'dark':'light'; h.dataset.theme=t; try{localStorage.setItem('prom-theme',t)}catch(e){}">
    <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>
<div class="drawer-shade" onclick="promDrawer(false)" hidden></div>
<aside id="drawer" class="drawer" aria-label="Menu" hidden>
  <div class="drawer-head">
    <span class="brand"><img src="/static/favicon.png" width="20" height="20" alt="">Prometheus</span>
    <button type="button" class="ghost" aria-label="Close the menu" onclick="promDrawer(false)">✕</button>
  </div>
  <div class="drawer-new"><button type="button" class="primary" hx-post="/chats" hx-swap="none"
    hx-on::after-request="if (event.detail.xhr.responseURL) location.href = event.detail.xhr.responseURL">+ New chat</button></div>
  <nav>
      <a href="/" {% if nav == "/" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Chat</span></a>
      <a href="/approvals" {% if nav == "/approvals" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg><span>Approvals</span>{% if pending %}<span class="badge">{{ pending }}</span>{% endif %}</a>
      <a href="/study" {% if nav == "/study" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4z"/><path d="M7 9v5c3 2 7 2 10 0V9"/></svg><span>Study</span></a>
      <a href="/money" {% if nav == "/money" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span>Money</span></a>
      <a href="/plans" {% if nav == "/plans" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Exams and deadlines</span></a>
      <a href="/memory" {% if nav == "/memory" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Memory</span></a>
      <a href="/skills" {% if nav == "/skills" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-10 10H4v-6z"/></svg><span>Skills and tools</span></a>
      <a href="/history" {% if nav == "/history" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg><span>File history</span></a>
      <a href="/costs" {% if nav == "/costs" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V9M12 19V5M19 19v-7"/></svg><span>Costs</span></a>
      <a href="/phone" {% if nav == "/phone" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span>Get it on your phone</span></a>
      <a href="/settings" {% if nav == "/settings" %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>Settings</span></a>
  </nav>
  <div class="drawer-chats"><span class="set-group">Chats</span>
    <div hx-get="/chats/search?q=" hx-trigger="load" hx-swap="innerHTML"></div></div>
  <div class="drawer-foot">
    <button type="button" id="notify-btn" onclick="promNotify()">Turn on phone notifications</button>
    <button type="button" hx-post="/logout" hx-swap="none" hx-on::after-request="location.href='/login'">Log out</button>
  </div>
</aside>
{% block body %}{% endblock %}
<script>
  function promDrawer(open) {
    const d = document.getElementById("drawer"), shade = document.querySelector(".drawer-shade"),
          btn = document.querySelector(".menu-btn");
    if (!d) return;
    if (open) { d.hidden = false; shade.hidden = false; requestAnimationFrame(() => d.classList.add("open"));
                d.querySelector("nav a")?.focus(); }
    else { d.classList.remove("open"); shade.hidden = true; setTimeout(() => { d.hidden = true; }, 200); btn?.focus(); }
    btn?.setAttribute("aria-expanded", open ? "true" : "false");
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") promDrawer(false); });
  document.querySelectorAll("#drawer nav a").forEach((a) => a.addEventListener("click", () => promDrawer(false)));
  // The orbs follow the header signal: busy while a task runs, grey after STOP ALL.
  function syncOrbs() {
    const core = document.querySelector("#core .core");
    const voice = core ? core.dataset.voice : "";
    const state = !core ? "idle" : core.classList.contains("stopped") ? "stopped"
      : voice === "listening" ? "listen" : voice === "speaking" ? "speak"
      : (core.classList.contains("busy") || voice === "thinking") ? "busy" : "idle";
    document.querySelectorAll("canvas[data-orb]").forEach((c) => { if (c.dataset.state !== state) c.dataset.state = state; });
  }
  document.body.addEventListener("htmx:afterSwap", () => { syncOrbs(); if (window.PrometheusOrb) PrometheusOrb.start(); });

  if (!window.promErrorsReady) {   // pages swapped into the window run this script again: set it up once
  window.promErrorsReady = true;
  // Every button gives an answer. A reply that is a real page (a form with its error message) is shown; anything else
  // (a bare "Not Found", a crash, no connection) never replaces the page: a short message says what happened.
  function promToast(text) {
    let t = document.getElementById("prom-toast");
    if (!t) { t = document.createElement("div"); t.id = "prom-toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = text; t.hidden = false;
    clearTimeout(t._timer); t._timer = setTimeout(() => { t.hidden = true; }, 7000);
  }
  var promWhy = (code) => code === 404 || code === 405
    ? "That button isn't in the running Prometheus yet: it was just updated. It restarts by itself in a minute; then try again."
    : code === 403 ? "Not allowed: your sign-in ran out or the password was wrong. Sign in again and retry."
    : code === 413 ? "That's too big to send."
    : code >= 500 ? "Something went wrong on Prometheus's side. It's in the log; try again, or restart Prometheus."
    : "That didn't work (" + code + ").";
  document.body.addEventListener("htmx:beforeSwap", (e) => {
    const xhr = e.detail.xhr;
    // a whole page meant for the window never goes inside one small box (that squeezed Settings into a column)
    if (e.detail.target !== document.body && /<main\b/i.test(xhr.responseText || "")) {
      e.detail.shouldSwap = false;
      htmx.swap(document.body, xhr.responseText, { swapStyle: "innerHTML" });
      return;
    }
    if (xhr.status < 400) return;
    const html = (xhr.getResponseHeader("content-type") || "").includes("text/html") && /<(main|form|p|div|section)\b/i.test(xhr.responseText || "");
    if (!html) { e.detail.shouldSwap = false; promToast(promWhy(xhr.status)); }
  });
  document.body.addEventListener("htmx:sendError", () => promToast("Prometheus isn't answering. Is it still running? If it just updated, wait a moment."));
  document.body.addEventListener("htmx:timeout", () => promToast("That's taking too long. Try again in a moment."));
  }
</script>
</body>
</html>
