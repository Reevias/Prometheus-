<script>
  // play a short sample of a voice before choosing it
  var promSample = null;
  async function promHear(engine, voice, btn) {
    if (promSample) { promSample.pause(); promSample = null; }
    const was = btn.textContent; btn.disabled = true; btn.textContent = "Making the sample…";
    try {
      const r = await fetch(`/voice/preview?engine=${engine}&voice=${encodeURIComponent(voice)}`);
      if (!r.ok) { const why = await r.text(); (window.promToast || alert)(why.slice(0, 300)); return; }
      const url = URL.createObjectURL(await r.blob());
      promSample = new Audio(url); btn.textContent = "Playing…";
      promSample.onended = () => { btn.textContent = was; btn.disabled = false; };
      await promSample.play();
      return;
    } catch (e) { (window.promToast || alert)("Couldn't play the sample: " + e.message); }
    finally { if (btn.textContent !== "Playing…") { btn.textContent = was; btn.disabled = false; } }
  }
  function promAdvanced(force) {
    const on = force !== undefined ? force : !document.body.classList.contains("show-adv");
    document.body.classList.toggle("show-adv", on);
    document.getElementById("adv-toggle").textContent = on ? "Hide advanced settings" : "Show advanced settings";
    try { localStorage.setItem("prom-adv", on ? "1" : ""); } catch (e) {}
  }
  try { if (localStorage.getItem("prom-adv") || (location.hash && document.querySelector(location.hash + ".adv"))) promAdvanced(true); } catch (e) {}
  function promFilterSettings(q) {
    q = (q || "").toLowerCase().trim();
    document.body.classList.toggle("searching", !!q);
    let shown = 0;
    document.querySelectorAll("section.set").forEach((s) => {
      const hit = !q || s.textContent.toLowerCase().includes(q);
      s.hidden = !hit; if (hit) shown++;
      const link = document.querySelector(`.set-nav a[href="#${s.id}"]`);
      if (link) link.hidden = !hit;
    });
    document.getElementById("set-none").hidden = shown > 0;
  }
</script>
