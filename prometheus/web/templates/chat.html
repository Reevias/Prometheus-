{% extends "base.html" %}
{% block body %}
<main>
  <section class="panel">
    <form hx-post="/chats" hx-swap="none" hx-on::after-request="location.href=event.detail.xhr.responseURL || '/'">
      <button type="submit">+ New chat</button>
    </form>
    <ul class="plain">
      {% for id, title in chats %}
        <li><a href="/chats/{{ id }}">{{ "▶ " if id == chat_id else "" }}{{ title }}</a></li>
      {% endfor %}
    </ul>
  </section>
  <section class="panel">
    <div id="messages" hx-get="/chats/{{ chat_id }}/messages" hx-trigger="every 2s">
      {% include "messages.html" %}
    </div>
    <form class="row" hx-post="/chats/{{ chat_id }}/send" hx-target="#messages" hx-on::after-request="this.reset()">
      <input type="text" name="text" placeholder="Tell Prometheus what to do…" required autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
  <aside class="panel">
    <h3>Status</h3>
    <div hx-get="/status?chat={{ chat_id }}" hx-trigger="load, every 2s"></div>
    <h3>Notes for this chat</h3>
    <ul class="plain" id="notes">{% for n in notes %}<li>{{ n.text }}</li>{% endfor %}</ul>
    <form class="row" hx-post="/chats/{{ chat_id }}/notes" hx-target="#notes" hx-on::after-request="this.reset()">
      <input type="text" name="text" placeholder="Add a note" required>
      <button type="submit">Add</button>
    </form>
  </aside>
</main>
{% endblock %}
