{% extends "base.html" %}
{% block body %}
<main>
  <section class="panel">
    <form hx-post="/chats" hx-swap="none" hx-on::after-request="location.href=event.detail.xhr.responseURL || '/'">
      <button type="submit">+ New chat</button>
    </form>
    <input type="search" name="q" class="chat-search" placeholder="Search chats" autocomplete="off" aria-label="Search chats"
           hx-get="/chats/search" hx-vals='{"current": {{ chat_id }}}' hx-trigger="input changed delay:300ms, search" hx-target="#chat-list">
    <div id="chat-list">{% include "chat_list.html" %}</div>
  </section>
  <section class="panel chat">
    <div class="chat-head">
      <h2 title="{{ chat_title }}">{{ chat_title }}</h2>
      {% include "head_select.html" %}
      <button type="button" hx-post="/chats/{{ chat_id }}/rename" hx-prompt="New name for this chat" hx-swap="none">Rename</button>
      <button type="button" class="danger" hx-post="/chats/{{ chat_id }}/delete" hx-swap="none"
              hx-confirm="Delete this chat and everything Prometheus kept from it? This can't be undone."
              hx-on::after-request="if (event.detail.xhr.status === 409) alert(event.detail.xhr.responseText)">Delete</button>
    </div>
    <div id="messages" hx-get="/chats/{{ chat_id }}/messages" hx-trigger="every 2s [document.visibilityState === 'visible']"
         hx-vals='js:{have: document.querySelectorAll("#messages .msg").length, busy: document.querySelector("#messages .working") ? 1 : 0}'
         hx-on::after-swap="this.scrollTop = this.scrollHeight">
      {% include "messages.html" %}
    </div>
    <form id="command" class="row command" hx-post="/chats/{{ chat_id }}/send" hx-target="#messages"
          hx-on::after-request="this.reset(); this.querySelector('textarea').style.height=''">
      <textarea name="text" rows="1" placeholder="Message Prometheus" title="Enter sends. Shift+Enter starts a new line." required autofocus
                oninput="this.style.height=''; this.style.height=Math.min(this.scrollHeight, 160)+'px'"
                onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); if (this.value.trim()) this.form.requestSubmit(); }"></textarea>
      <button type="submit" class="primary">Send</button>
    </form>
    <script>
      (function () {
        const box = document.getElementById('messages');
        const hit = location.hash && document.getElementById(location.hash.slice(1));
        if (hit) { hit.scrollIntoView({block: 'center'}); hit.classList.add('found'); } else { box.scrollTop = 1e9; }
      })();
    </script>
  </section>
  <aside class="panel">
    <canvas class="orb orb-side" data-orb data-small data-state="idle" aria-hidden="true"></canvas>
    <h3>Status</h3>
    <div hx-get="/status?chat={{ chat_id }}" hx-trigger="load, every 2s [document.visibilityState === 'visible']"></div>
    <h3>Notes for this chat</h3>
    <ul class="plain" id="notes">{% for n in notes %}<li>{{ n.text }}</li>{% endfor %}</ul>
    <form class="row" hx-post="/chats/{{ chat_id }}/notes" hx-target="#notes" hx-on::after-request="this.reset()">
      <input type="text" name="text" placeholder="Add a note" required>
      <button type="submit">Add</button>
    </form>
  </aside>
</main>
{% endblock %}
