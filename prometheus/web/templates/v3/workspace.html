<main class="v3-workspace" role="main">
  <!-- Orbital Visualization Canvas (Component 3) -->
  <div class="orbital-canvas-container" aria-hidden="true">
    <canvas id="orbital-canvas"></canvas>
  </div>

  <!-- Workspace Central Content -->
  <div class="workspace-content">
    <!-- Branding Typography (Component 4) -->
    <div class="central-branding">
      <h1 class="central-title">Prometheus</h1>
      <p class="central-subtitle">Your Personal AI System</p>
    </div>

    <!-- Primary Command Bar (Component 5) -->
    <div class="command-bar-wrapper">
      <form id="command-form" class="command-bar">
        <button type="button" class="slash-indicator" id="slash-indicator" title="Open Slash Commands (/)" aria-label="Open Slash Commands">
          <span>/</span>
        </button>

        <textarea
          id="command-input"
          name="text"
          class="command-input"
          placeholder="Ask Prometheus anything..."
          rows="1"
          autocomplete="off"
          autofocus
        ></textarea>

        <div class="command-actions">
          <button type="button" class="cmd-btn mic-btn" id="mic-btn" title="Hold to talk" aria-label="Hold to talk">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span class="sr-only" style="display:none">Hold to talk</span>
          </button>

          <button type="submit" class="cmd-btn submit-btn" id="submit-btn" title="Send Instruction" aria-label="Send Instruction">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- 5 Quick Action Buttons (Component 7) -->
    <div class="quick-actions" role="group" aria-label="Quick Actions">
      <button type="button" class="chip" data-action="code">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        <span>Code</span>
      </button>

      <button type="button" class="chip" data-action="research">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Research</span>
      </button>

      <button type="button" class="chip" data-action="automate">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Automate</span>
      </button>

      <button type="button" class="chip" data-action="pc">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>Control PC</span>
      </button>

      <button type="button" class="chip" data-action="more">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>More</span>
      </button>
    </div>
  </div>

  <!-- Atmospheric Flowing Bottom Wave (Component 12) -->
  <div class="atmospheric-wave" aria-hidden="true">
    <svg class="wave-svg" viewBox="0 0 1440 220" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="waveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FF922B" stop-opacity="0.32" />
          <stop offset="30%" stop-color="#FF922B" stop-opacity="0.14" />
          <stop offset="70%" stop-color="#E8590C" stop-opacity="0.04" />
          <stop offset="100%" stop-color="#0B0B10" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="waveHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FF922B" stop-opacity="0" />
          <stop offset="50%" stop-color="#FFC06A" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#FF922B" stop-opacity="0" />
        </linearGradient>
      </defs>
      <!-- Layer 1: Ambient deep wave -->
      <path d="M0,80 C320,160 540,20 840,90 C1140,160 1320,50 1440,80 L1440,220 L0,220 Z" fill="url(#waveGlow)" />
      <!-- Layer 2: Surface highlight ridge -->
      <path d="M0,80 C320,160 540,20 840,90 C1140,160 1320,50 1440,80" stroke="url(#waveHighlight)" stroke-width="2" fill="none" opacity="0.6" />
      <!-- Layer 3: Secondary gentle undulating wave -->
      <path d="M0,120 C240,60 600,150 960,80 C1200,30 1380,100 1440,110 L1440,220 L0,220 Z" fill="rgba(255, 146, 43, 0.05)" />
    </svg>
  </div>
</main>
