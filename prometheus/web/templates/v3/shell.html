<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prometheus 3.0</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B0B10">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>try{var t=localStorage.getItem("prom-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/static/v3/theme.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/phone.js" defer></script>
  <script src="/static/v3/orbital_canvas.js" defer></script>
  <script src="/static/v3/app.js" defer></script>
</head>
<body data-csrf="{{ csrf }}" hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <!-- Background Refresh Trigger for HTMX Compatibility -->
  <div id="v3-live-trigger" hx-get="/api/v3/state" hx-trigger="every 4s [document.visibilityState === 'visible']" hx-swap="none" style="display:none;"></div>

  <!-- Compatibility Hidden File Input & Theme Toggle for Legacy Suites -->
  <input type="file" name="file" id="legacy-file-input" style="display:none;" aria-hidden="true">
  <button type="button" class="theme-toggle" style="display:none;" aria-hidden="true"
          onclick="const h=document.documentElement, t=h.dataset.theme==='light'?'dark':'light'; h.dataset.theme=t; try{localStorage.setItem('prom-theme',t)}catch(e){}">
  </button>

  <div class="v3-shell">
    {% include "v3/sidebar.html" %}
    {% include "v3/workspace.html" %}
    {% include "v3/right_panel.html" %}
  </div>

  {% include "v3/slash_palette.html" %}
</body>
</html>
