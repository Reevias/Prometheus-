<div id="slash-palette-overlay" class="slash-palette-overlay" hidden>
  <div class="slash-palette" role="dialog" aria-modal="true" aria-label="Command Palette">
    <div class="palette-search-wrapper">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        id="palette-search"
        class="palette-search-input"
        placeholder="Type a command or search..."
        autocomplete="off"
        spellcheck="false"
      />
      <span style="font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;">ESC to close</span>
    </div>

    <div id="palette-list" class="palette-list" role="listbox">
      <!-- Populated dynamically by app.js -->
    </div>
  </div>
</div>
