<aside class="v3-right-panel" aria-label="System and Agent Status">
  <!-- Top Header Row (Components 8 & 13) -->
  <div class="panel-header-row">
    <div class="status-badge-wrapper">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Prometheus Online</span>
      </div>

      <!-- Live Animated Audio Waveform -->
      <div class="audio-waveform" aria-hidden="true" title="Audio / Neural Core Activity">
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
      </div>
    </div>

    <!-- Native Desktop Window Controls (Component 13) -->
    <div class="window-controls">
      <button type="button" class="win-btn" id="win-min-btn" title="Minimize" aria-label="Minimize Window">
        <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor">
          <rect y="5" width="12" height="1.5" rx="0.75"/>
        </svg>
      </button>

      <button type="button" class="win-btn" id="win-max-btn" title="Maximize" aria-label="Maximize Window">
        <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="1" y="1" width="10" height="10" rx="1.5"/>
        </svg>
      </button>

      <button type="button" class="win-btn close-btn" id="win-close-btn" title="Close" aria-label="Close Window">
        <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="2" y1="2" x2="10" y2="10"/>
          <line x1="10" y1="2" x2="2" y2="10"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Card 1: System Monitoring (Component 9) -->
  <section class="v3-card" id="card-system">
    <div class="card-header">
      <div class="card-title-group">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span class="card-title">System</span>
      </div>
    </div>

    <div class="gauges-container">
      <!-- CPU Gauge -->
      <div class="gauge-item">
        <div class="gauge-svg-wrapper">
          <svg class="gauge-svg" viewBox="0 0 68 68">
            <circle class="gauge-bg" cx="34" cy="34" r="28" />
            <circle
              class="gauge-fill cpu-fill"
              id="cpu-gauge-fill"
              cx="34"
              cy="34"
              r="28"
              stroke-dasharray="175.93"
              stroke-dashoffset="140"
            />
          </svg>
          <span class="gauge-value" id="cpu-gauge-val">--%</span>
        </div>
        <span class="gauge-label">CPU</span>
      </div>

      <!-- RAM Gauge -->
      <div class="gauge-item">
        <div class="gauge-svg-wrapper">
          <svg class="gauge-svg" viewBox="0 0 68 68">
            <circle class="gauge-bg" cx="34" cy="34" r="28" />
            <circle
              class="gauge-fill ram-fill"
              id="ram-gauge-fill"
              cx="34"
              cy="34"
              r="28"
              stroke-dasharray="175.93"
              stroke-dashoffset="60"
            />
          </svg>
          <span class="gauge-value" id="ram-gauge-val">--%</span>
        </div>
        <span class="gauge-label">RAM</span>
      </div>

      <!-- GPU Gauge -->
      <div class="gauge-item">
        <div class="gauge-svg-wrapper">
          <svg class="gauge-svg" viewBox="0 0 68 68">
            <circle class="gauge-bg" cx="34" cy="34" r="28" />
            <circle
              class="gauge-fill gpu-fill"
              id="gpu-gauge-fill"
              cx="34"
              cy="34"
              r="28"
              stroke-dasharray="175.93"
              stroke-dashoffset="175.93"
            />
          </svg>
          <span class="gauge-value" id="gpu-gauge-val">N/A</span>
        </div>
        <span class="gauge-label">GPU</span>
      </div>
    </div>
  </section>

  <!-- Card 2: Active Agent (Component 10) -->
  <section class="v3-card" id="card-active-agent">
    <div class="card-header">
      <div class="card-title-group">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
        <span class="card-title">Active Agent</span>
      </div>
      <span class="agent-status-badge" id="active-agent-badge">Ready</span>
    </div>

    <div class="agent-profile">
      <div class="agent-avatar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
      </div>
      <div class="agent-meta">
        <div class="agent-name-row">
          <span class="agent-name" id="active-agent-name">System Orchestrator</span>
        </div>
        <p class="agent-desc" id="active-agent-desc">Ready to assist with development and system tasks</p>
      </div>
    </div>
  </section>

  <!-- Card 3: Current Task (Component 11) -->
  <section class="v3-card" id="card-current-task">
    <div class="card-header">
      <div class="card-title-group">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span class="card-title">Current Task</span>
      </div>
    </div>

    <div class="task-content">
      <div class="task-title-row">
        <span class="task-title" id="current-task-title">System Monitoring</span>
        <span class="task-percent" id="current-task-percent">100%</span>
      </div>

      <div class="task-progress-bar">
        <div class="task-progress-fill" id="current-task-fill" style="width: 100%;"></div>
      </div>

      <p class="task-detail" id="current-task-detail">All systems operational</p>
    </div>
  </section>
</aside>
