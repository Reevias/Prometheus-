<ul class="plain">
{% for m in memories %}<li>{{ m.text }}{% if m.source %} <span class="muted">({{ m.source }})</span>{% endif %} <button class="danger" hx-post="/memory/{{ m.id }}/delete" hx-target="#memory">Delete</button></li>
{% else %}<li class="muted">Nothing saved yet.</li>{% endfor %}
</ul>
