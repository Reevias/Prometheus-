[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus"
version = "0.1.0"
description = "Personal multi-agent AI brain that runs on your own laptop"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=0.69",
    "send2trash>=1.8",
    "pillow>=10.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7"]
desktop = ["pywebview>=5.0"]

[project.scripts]
prometheus = "prometheus.cli:main"

[tool.setuptools.packages.find]
include = ["prometheus*"]

[tool.setuptools.package-data]
prometheus = ["prompts/*.md", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
