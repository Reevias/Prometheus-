[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus"
version = "2.3.0"
description = "Personal multi-agent AI brain that runs on your own laptop"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Reevias"}]
dependencies = [
    "fpdf2>=2.7",
    "cryptography>=42",
    "pywebpush>=2.0",
    "qrcode>=7.4",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=0.69",
    "send2trash>=1.8",
    "pillow>=10.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["pywebview>=5.0", "pystray>=0.19", "pillow>=10"]
antigravity = ["google-genai>=1.0"]
browser = ["playwright>=1.45"]
photos = ["fastembed>=0.4", "rapidocr>=3", "onnxruntime>=1.20", "pillow>=10"]
voice = ["vosk>=0.3.45", "faster-whisper>=1.1", "sounddevice>=0.5", "numpy>=2.0.2", "onnxruntime>=1.20",
         "espeakng-loader>=0.2.4", "phonemizer-fork>=3.3", "soundfile>=0.12", "colorlog>=6"]
# kokoro-onnx (the laptop voice) is installed by itself with --no-deps: its label says Python <3.14, but it works on
# 3.14 (tested), and everything it needs is listed under voice above.

[project.urls]
Repository = "https://github.com/Reevias/Prometheus-"

[project.scripts]
prometheus = "prometheus.cli:main"

[tool.setuptools.packages.find]
include = ["prometheus*"]

[tool.setuptools.package-data]
prometheus = ["prompts/*.md", "web/templates/*.html", "web/static/*", "skills/*/SKILL.md", "skills/*/references/*.md", "data/*.json", "data/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
