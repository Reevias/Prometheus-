[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus"
version = "1.4.0"
description = "Personal multi-agent AI brain that runs on your own laptop"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Reevias"}]
dependencies = [
    "fpdf2>=2.7",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=0.69",
    "send2trash>=1.8",
    "pillow>=10.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["pywebview>=5.0", "pystray>=0.19", "pillow>=10"]
antigravity = ["google-genai>=1.0"]
browser = ["playwright>=1.45"]
photos = ["fastembed>=0.4", "rapidocr-onnxruntime>=1.3", "pillow>=10"]
voice = ["vosk>=0.3.45", "faster-whisper>=1.1", "kokoro-onnx>=0.4", "sounddevice>=0.5", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/Reevias/Prometheus-"

[project.scripts]
prometheus = "prometheus.cli:main"

[tool.setuptools.packages.find]
include = ["prometheus*"]

[tool.setuptools.package-data]
prometheus = ["prompts/*.md", "web/templates/*.html", "web/static/*", "skills/*/SKILL.md", "skills/*/references/*.md", "data/*.json", "data/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
